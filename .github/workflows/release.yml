name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    environment: release

    # Required repository secrets:
    # APPLE_CERTIFICATE_P12_BASE64, APPLE_CERTIFICATE_PASSWORD,
    # APPLE_SIGNING_IDENTITY, APPLE_TEAM_ID, APPLE_API_PRIVATE_KEY,
    # APPLE_API_KEY_ID, APPLE_API_ISSUER_ID.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Require Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Require a tag from main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Verify tagged source
        env:
          RUN_UI_TESTS: 1
        run: ./scripts/verify.sh
      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          certificate="$RUNNER_TEMP/developer-id.p12"
          keychain="$RUNNER_TEMP/mutelet-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$CERTIFICATE_PASSWORD" -t cert -f pkcs12 -k "$keychain" -T /usr/bin/codesign
          security list-keychains -d user -s "$keychain" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
      - name: Build, sign, notarize, and package
        env:
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          export NOTARY_KEY="$RUNNER_TEMP/AuthKey_${NOTARY_KEY_ID}.p8"
          printf '%s' "$API_PRIVATE_KEY" > "$NOTARY_KEY"
          ./scripts/release.sh "$version"
      - name: Upload draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="changelogs/$version.md"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          elif [[ -f "$notes" ]]; then
            gh release create "$GITHUB_REF_NAME" dist/* --draft --title "Mutelet $version" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --draft --title "Mutelet $version" --generate-notes
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/mutelet-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP"/AuthKey_*.p8
