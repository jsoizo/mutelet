name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    environment: release

    # Required release environment secret: OP_SERVICE_ACCOUNT_TOKEN.
    # Apple signing and notarization credentials are loaded from 1Password.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Require Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Require a tag from main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Verify tagged source
        env:
          RUN_UI_TESTS: 1
        run: ./scripts/verify.sh
      - name: Load release secrets from 1Password
        id: release_secrets
        uses: 1Password/load-secrets-action@e544b780808654ba8ceba5fb2fe2897103d92ff4 # v5.0.0
        with:
          version: "2.31.1"
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          APPLE_CERTIFICATE_P12_BASE64: op://Mutelet Dev/Developer-ID/application-certificate-b64
          APPLE_CERTIFICATE_PASSWORD: op://Mutelet Dev/Developer-ID/certificate-password
          APPLE_SIGNING_IDENTITY: op://Mutelet Dev/Developer-ID/signing-identity
          APPLE_TEAM_ID: op://Mutelet Dev/Developer-ID/team-id
          APPLE_API_PRIVATE_KEY_BASE64: op://Mutelet Dev/App-Store-Connect/auth-key-b64
          APPLE_API_KEY_ID: op://Mutelet Dev/App-Store-Connect/key-id
          APPLE_API_ISSUER_ID: op://Mutelet Dev/App-Store-Connect/issuer-id
      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ steps.release_secrets.outputs.APPLE_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ steps.release_secrets.outputs.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          certificate="$RUNNER_TEMP/developer-id.p12"
          keychain="$RUNNER_TEMP/mutelet-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$CERTIFICATE_PASSWORD" -t cert -f pkcs12 -k "$keychain" -T /usr/bin/codesign
          security list-keychains -d user -s "$keychain" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
      - name: Build, sign, notarize, and package
        env:
          DEVELOPMENT_TEAM: ${{ steps.release_secrets.outputs.APPLE_TEAM_ID }}
          DEVELOPER_ID_APPLICATION: ${{ steps.release_secrets.outputs.APPLE_SIGNING_IDENTITY }}
          NOTARY_KEY_ID: ${{ steps.release_secrets.outputs.APPLE_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ steps.release_secrets.outputs.APPLE_API_ISSUER_ID }}
          API_PRIVATE_KEY_BASE64: ${{ steps.release_secrets.outputs.APPLE_API_PRIVATE_KEY_BASE64 }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          application_version="${version%%-*}"
          export NOTARY_KEY="$RUNNER_TEMP/AuthKey_${NOTARY_KEY_ID}.p8"
          printf '%s' "$API_PRIVATE_KEY_BASE64" | base64 --decode > "$NOTARY_KEY"
          ./scripts/release.sh "$application_version"
      - name: Upload GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          application_version="${version%%-*}"
          notes="changelogs/$version.md"
          release_assets=(
            "dist/Mutelet-$application_version.dmg"
            "dist/Mutelet-$application_version.dmg.sha256"
          )
          for asset in "${release_assets[@]}"; do
            if [[ ! -f "$asset" ]]; then
              echo "error: release asset was not produced: $asset" >&2
              exit 1
            fi
          done
          is_prerelease=false
          if [[ "$version" == *-* ]]; then
            is_prerelease=true
          fi
          if release_is_draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "$release_is_draft" != "true" ]]; then
              echo "error: refusing to replace assets on published release $GITHUB_REF_NAME" >&2
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" "${release_assets[@]}" --clobber
          elif [[ -f "$notes" ]]; then
            gh release create "$GITHUB_REF_NAME" "${release_assets[@]}" --draft --prerelease="$is_prerelease" --title "Mutelet $version" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" "${release_assets[@]}" --draft --prerelease="$is_prerelease" --title "Mutelet $version" --generate-notes
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease="$is_prerelease"
      - name: Preserve release diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-diagnostics-${{ github.run_id }}
          path: dist/
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/mutelet-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP"/AuthKey_*.p8
